[project]
name = "wordle-turns"
version = "0.1.0"
description = "Wordle (TextArena Wordle-v0) with per-turn shaped rewards for turn-level credit assignment."
requires-python = ">=3.11"
dependencies = ["verifiers[ta]", "wordle"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wordle_turns"]
